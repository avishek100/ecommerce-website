services:
  - type: web
    name: novashop
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --prefix client && npm ci --prefix server && npm --prefix client run build
    startCommand: node server/src/deploy.js
    healthCheckPath: /api/health
    disk:
      name: novashop-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
